[project]
name = "pm2-mcp"
version = "0.5.0"
description = "FastMCP server providing structured read and limited write access to PM2 services"
requires-python = ">=3.11"
dependencies = [
    # Capped below 4: uv.lock pins what is tested and deployed, and the CI `latest` job
    # resolves the newest versions these ranges allow, so a forward-compat break shows up
    # there rather than at the next deploy (vikunja#611). Moving to 4.x is its own change.
    #
    # Security floors (2026-10-25). fastmcp 3.4.10 fixes GHSA-7xgj-8392-5q4r; mcp 1.30.0
    # fixes PYSEC-2026-3481/3482/3483 and the StreamableHTTP advisories, the transport this
    # server runs. mcp is transitive, declared only to hold that floor.
    "fastmcp>=3.4.10,<4",
    "mcp>=1.30,<2",
    # Also transitive, and declared only to hold each one above its advisories' fixed
    # version: `pip install .` into an existing venv keeps whatever it finds otherwise.
    # pm2_mcp imports none of them. Drop an entry once fastmcp's own floor covers it.
    "anyio>=4.14.2",              # PYSEC-2026-4024/4025
    # 50, not 49: PYSEC-2026-3552 is fixed only in 50.0.0. pip-audit on
    # cryptography==49.0.0 still reports it (measured 2026-10-25).
    "cryptography>=50.0.0",       # PYSEC-2026-3552/3553/3554, GHSA-537c-gmf6-5ccf
    "joserfc>=1.6.8",             # PYSEC-2026-2528
    "PyJWT>=2.15.0",              # PYSEC-2026-4140..4152, CVE-2026-102275
    "urllib3>=2.8.0",             # PYSEC-2026-4175/4176/4177
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    "python-multipart>=0.0.31",   # PYSEC-2026-3036/3037/3040
    "starlette>=1.3.1",           # PYSEC-2026-248/249
    "certifi>=2026.10.19",        # PYSEC-2026-4320
    "opentelemetry-api>=1.45.1",  # CVE-2026-114603
]

[project.optional-dependencies]
# uv.lock is the single source for dev dependencies, which replaced requirements-dev.txt
# (and requirements.txt) in v0.5.0: one list, locked, so CI lints, tests, mutates and
# audits with the versions it was tested with.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "mutmut>=3.7,<4",
    "pip-audit>=2.10",
]

[project.scripts]
pm2-mcp = "pm2_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
# `setuptools.backends.legacy:build` was here until 2026-09-09 and is not a real backend —
# `python -m build` failed outright with `BackendUnavailable`, unnoticed for two releases
# because the old smoke test imported from the source tree (vikunja#769).
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# src/ layout since v0.5.0 (repo standard P2). Explicit, NOT redundant: flat-layout
# auto-discovery inferred the wheel's contents from whatever directories were present,
# and a build straight after a local `mutmut run` shipped mutants/server.py and
# mutants/tests/ with NO top-level server.py (measured 2026-09-09). Naming the root and
# the package pins the contents regardless of what else is lying around.
where = ["src"]
include = ["pm2_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pm2_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is in addopts, not just in CI, so a bare `pytest` enforces the floor below. The
# floor existing in config but only being applied by a CI flag is how a floor ends up
# unenforced everywhere it would actually catch something — which is the state this repo was
# in before 2026-09-09. Requires pytest-cov, which the locked dev extra installs.
# `-m "not integration"`: tests/test_integration_pm2.py starts a real pm2 daemon. It runs as
# its own CI job (`pytest -m integration --no-cov`; a later -m replaces this one), and must
# stay out of mutmut's runs, which inherit these addopts: every _run_pm2 mutant would
# otherwise drive a live daemon.
addopts = "--cov=pm2_mcp --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: needs a real pm2 CLI; starts and kills a private daemon (vikunja#771)",
]

[tool.coverage.run]
source = ["pm2_mcp"]

[tool.coverage.report]
show_missing = true
# MEASURED 100.00% on 2026-09-10 — 176 statements, 0 missed, 85 passing tests.
#
# Previous annotation read "2026-09-09 — 129 statements, 47 passing tests" and had already
# drifted when it was written: PR #8 landed inside the same build, after the comment. The
# jump to 176/85 is vikunja#772 (_configure_logging) and #770 (_resolve_bind, _is_loopback)
# plus their tests. The percentage and the floor did not move; only the measurement did.
#
# The date is the point: an undated floor cannot be told from a stale one. This repo is the
# argument for that. Real coverage was 88% and the floor was enforced NOWHERE, so a regression
# to any depth would have gone unremarked; setting it to Baseline's 80 instead would have
# permitted an eight-point drop on day one.
#
# 100 is not aspirational here, it is the measurement. The gap to 88 was entirely the
# `except RuntimeError` branch of the five privileged write tools plus get_status's two
# degraded paths — i.e. every uncovered line was a failure path on a tool that can stop or
# restart any PM2 process on the host. Those now have named negative tests, so the floor and
# the measurement coincide and any new untested line fails the build. If that becomes
# genuinely impractical for a future change, lower it deliberately and record the new number
# and date here — do not delete the line.
fail_under = 100
exclude_also = [
    # The streamable-http entry point. Driving it from a test would start a real server on
    # a real port; excluding it is honest, asserting coverage over it would not be.
    'if __name__ == .__main__.:',
]

[tool.mutmut]
# Mutation-testing pilot (vikunja#769). The GATE is not this config — see .github/workflows/
# ci.yml, which filters `mutmut results` by mutant key. mutmut has no function-level scoping:
# only_mutate/do_not_mutate take FILE globs and the server is a single module, so
# there is no config that expresses "mutate only the trust-boundary functions". Verified
# against mutmut 3.7.0's own configuration.py.
source_paths = ["src/pm2_mcp/server.py"]
pytest_add_cli_args_test_selection = ["tests/"]
# --no-cov is load-bearing, not tidiness, and this is the pilot's most transferable finding.
#
# [tool.pytest.ini_options].addopts turns coverage on for EVERY pytest run, carrying
# fail_under = 100. mutmut works by rewriting server.py into mutants/src/, where all 129
# mutants exist side by side as separate functions and exactly one is active per run — 129
# statements become 1107. By construction the other 128 mutants' bodies are never executed,
# so coverage in that directory measures ~37% no matter how good the tests are.
#
# Measured 2026-09-09 without this line: `mutmut run` aborts immediately with
# "failed to collect stats. runner returned 1" and evaluates ZERO mutants. Reproduced by hand
# in mutants/: all 47 tests PASS and pytest still exits 1, purely on the coverage floor.
#
# The general hazard is worth stating because it outlives this repo: mutmut infers
# killed-vs-survived from pytest's EXIT CODE alone. Any non-zero exit that does not come from
# a failing assertion — a coverage floor, a lint hook, a plugin error — is silently read as
# "the tests caught this mutant". Here it failed loudly and early, which was luck: a floor
# low enough to survive stats collection would instead have marked mutants killed by the
# gate rather than by a test, and a trust-boundary mutant nothing tests would have been
# reported as caught.
#
# --ignore=tests/test_mutation_gate.py: that module tests scripts/mutation-gate.sh, which
# mutmut does not copy into mutants/, and it has no pm2_mcp mutants to kill. Collected
# there, it failed on the missing script and aborted stats collection, leaving most
# mutants `not checked`. Measured 2026-10-25, the first run after it was added: the
# hardened gate failed on that (F-02); the old one would have printed PASS.
pytest_add_cli_args = ["--no-cov", "--ignore=tests/test_mutation_gate.py"]
# The gate must evaluate the WHOLE trust-boundary mutant set on every run, not just the
# mutants touching code that changed since the last commit. With change detection left on,
# a PR that does not touch server.py could evaluate nothing and the survivor check would
# pass having looked at no mutants. scripts/mutation-gate.sh has a positive control that
# would catch that, but a gate should not depend on its own backstop for ordinary runs.
use_git_change_detection = false
