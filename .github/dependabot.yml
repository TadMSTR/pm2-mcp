version: 2

updates:
  # uv, not pip: the committed uv.lock is what CI audits and tests, so it is what
  # Dependabot has to move (repo standard F11). The uv ecosystem updates pyproject.toml
  # and uv.lock together.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # A Python major is a reading task, not an auto-merge: fastmcp and mcp are capped
    # below their next major in pyproject.toml for that reason. Minor, patch and
    # security PRs still open normally.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Explicit and sized to this repo: the distinct `uses:` paths across
    # .github/workflows/, codeql-action's subpaths counted once (6, 2026-10-25:
    # checkout, setup-python, setup-uv, upload-artifact, codeql-action,
    # scorecard-action). At the default cap of 5 Dependabot silently holds the next
    # bump back (vikunja#932, #937). Re-count when a workflow adds an action.
    open-pull-requests-limit: 6
    # codeql-action's init, analyze and upload-sarif must move to one SHA together or
    # CodeQL ends `neutral` (vikunja#930, #936). The group is repeated for security
    # updates because a group without `applies-to` covers version updates only.
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
      codeql-action-security:
        applies-to: security-updates
        patterns: ["github/codeql-action*"]
    # Majors are NOT ignored here. Actions are pinned to commit SHAs and Dependabot is
    # the only thing that will move them; an action major is CI-only and fails visibly
    # in its PR rather than at runtime.
