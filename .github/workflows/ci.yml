name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter. With `branches: [main]` a pull request opened against any base
  # other than main ran NO jobs at all — and a PR with zero checks does not look failed, it
  # looks like CI has not started yet. Found when this very branch was opened against
  # another feature branch and sat with no checks. Stacked PRs are exactly where the risk
  # is highest, since the second change is reviewed against a base that is not yet merged.
  pull_request:
  schedule:
    # Weekly, Monday 05:41 UTC, so the `latest` job meets a new upstream release without
    # waiting for a PR. Clear of secret-scan.yml's slot.
    - cron: "41 5 * * 1"

# Least privilege at the top level (repo standard F6). No job below escalates.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Without this the SHA-pinned action fetches the latest uv. Move it by hand, in
          # every job, alongside a `uv lock` refresh.
          version: "0.13.4"
      # FROM THE LOCK. `--frozen` installs exactly uv.lock and fails rather than
      # re-resolve, so a green run is evidence about the set that is deployed.
      - name: Install dependencies (locked, [dev])
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --frozen --extra dev
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Without this the SHA-pinned action fetches the latest uv. Move it by hand, in
          # every job, alongside a `uv lock` refresh.
          version: "0.13.4"
      # FROM THE LOCK. `--frozen` installs exactly uv.lock and fails rather than
      # re-resolve, so a green run is evidence about the set that is deployed.
      - name: Install dependencies (locked, [dev])
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --frozen --extra dev
      # Coverage and its floor come from pyproject.toml's addopts, so this is the same
      # command a developer runs locally and enforces the same 100% floor.
      - name: Run tests
        run: uv run --frozen --no-sync pytest -v

  mutation:
    name: Mutation gate (trust-boundary functions)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Without this the SHA-pinned action fetches the latest uv. Move it by hand, in
          # every job, alongside a `uv lock` refresh.
          version: "0.13.4"
      # FROM THE LOCK. `--frozen` installs exactly uv.lock and fails rather than
      # re-resolve, so a green run is evidence about the set that is deployed.
      - name: Install dependencies (locked, [dev])
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --frozen --extra dev
      # Zero surviving mutants in _clean_env and _run_pm2 — NOT a repo-wide score.
      # _parse_summary's survivors are expected and deliberately not gated; the reasoning,
      # and the recorded evidence that this gate goes red, are in the script itself.
      - name: Mutation gate
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          scripts/mutation-gate.sh

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-results
          path: mutmut-results.txt
          if-no-files-found: warn

  # vikunja#771: the write verbs against a real pm2 CLI and a private daemon, in shadow and
  # enforce mode, plus a negative control that must fail. tests/test_integration_pm2.py
  # explains the isolation. pm2 is pinned to the version forge runs, and installed under
  # RUNNER_TEMP with the runner's own node, so it is reachable only through PATH.
  integration:
    name: Integration (real pm2 6.0.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Without this the SHA-pinned action fetches the latest uv. Move it by hand, in
          # every job, alongside a `uv lock` refresh.
          version: "0.13.4"
      # FROM THE LOCK. `--frozen` installs exactly uv.lock and fails rather than
      # re-resolve, so a green run is evidence about the set that is deployed.
      - name: Install dependencies (locked, [dev])
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --frozen --extra dev
      - name: Install pm2 6.0.14
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pm2" --no-audit --no-fund pm2@6.0.14
          echo "$RUNNER_TEMP/pm2/node_modules/.bin" >> "$GITHUB_PATH"
      # From package.json, not `pm2 --version`: on a host with no daemon yet, that spawns
      # one and prints its startup lines too, so the comparison fails (measured in CI,
      # 2026-10-25).
      - name: pm2 is the pinned version
        run: |
          v=$(node -p "require('$RUNNER_TEMP/pm2/node_modules/pm2/package.json').version")
          echo "pm2 $v"
          test "$v" = "6.0.14"
          test "$(command -v pm2)" = "$RUNNER_TEMP/pm2/node_modules/.bin/pm2"
      - name: Integration tests
        run: uv run --frozen --no-sync pytest -m integration --no-cov -v

  # The newest versions pyproject.toml allows, not the lock. The lock is what ships, so
  # every other job tests it; this one exists because a pin alone hides a forward-
  # compatibility break until the day someone re-resolves (vikunja#611).
  #
  # GATING, deliberately. The ranges are capped below the next major, so anything that
  # breaks here is a release a fresh install could pick up today. A continue-on-error job
  # would show a green tick over a red run, which is the signal this job exists to show.
  latest:
    name: Test against latest allowed versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Without this the SHA-pinned action fetches the latest uv. Move it by hand, in
          # every job, alongside a `uv lock` refresh.
          version: "0.13.4"
      - name: Resolve and install the newest allowed set
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          uv lock --upgrade
          uv sync --frozen --extra dev
      # Read from the project venv: a bare `uv pip list` follows UV_PYTHON to the
      # setup-python interpreter, which has none of these installed.
      - name: Versions under test
        run: >-
          uv run --frozen --no-sync python -c "import importlib.metadata as m;
          [print(p, m.version(p)) for p in ('fastmcp', 'mcp', 'starlette', 'uvicorn')]"
      - run: uv run --frozen --no-sync pytest

  # DEPENDENCY AUDIT, against the lock. `pip-audit -r requirements.txt`, which this job ran
  # until v0.5.0, re-resolves the declared ranges and reports on what a fresh install would
  # get today, not on what is pinned and deployed.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Without this the SHA-pinned action fetches the latest uv. Move it by hand, in
          # every job, alongside a `uv lock` refresh.
          version: "0.13.4"
      # A committed lock nobody checks is a stale file that looks like a pin.
      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check
      # Two sets: a runtime advisory affects the deployed server, a dev advisory only CI.
      # --no-emit-project: --strict trips on the project's own versionless entry.
      - name: Export runtime and dev dependency sets
        run: |
          mkdir -p .audit-runtime .audit-dev
          uv export --frozen --no-emit-project --no-extra dev \
            --format pylock.toml -o .audit-runtime/pylock.toml
          uv export --frozen --no-emit-project --extra dev \
            --format pylock.toml -o .audit-dev/pylock.toml
      # Separate directories, so `--locked` cannot merge the two. pip-audit is pinned.
      # --strict fails on any dependency pip-audit cannot fully resolve, rather than
      # reporting it and exiting 0. No --ignore-vuln without a dated, ticket-referenced
      # reason next to it.
      - name: Audit runtime dependencies
        run: uv tool run --from "pip-audit==2.10.1" pip-audit --strict --locked .audit-runtime
      - name: Audit dev dependencies
        run: uv tool run --from "pip-audit==2.10.1" pip-audit --strict --locked .audit-dev

  build:
    name: Build and verify the installed artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"

      - name: Build wheel and sdist
        run: uv build

      # This job exists because the package was UNBUILDABLE for two releases without CI
      # noticing (vikunja#769): build-backend named a backend that does not exist, and the
      # old smoke test imported from the source tree, which passes whether or not the
      # package can be built or installed.
      #
      # So: install the wheel into a clean venv, with the locked runtime set, and import
      # from THAT with the working directory outside the checkout, so a stray source tree
      # on the path cannot satisfy the import and hide a broken artifact. The console
      # script is what ecosystem.config.js runs, so it is checked as well.
      - name: Install the wheel into a clean venv and smoke-test it
        run: |
          set -euxo pipefail
          uv export --frozen --no-emit-project --no-extra dev -o "$RUNNER_TEMP/runtime.txt"
          uv venv -q /tmp/verify
          uv pip install -q -p /tmp/verify -r "$RUNNER_TEMP/runtime.txt"
          uv pip install -q -p /tmp/verify --no-deps dist/*.whl
          mkdir -p /tmp/elsewhere
          cd /tmp/elsewhere
          test ! -e src
          /tmp/verify/bin/python -c "
          import pm2_mcp.server as server
          print('imported from:', server.__file__)
          assert '/tmp/verify/' in server.__file__, 'imported the checkout, not the wheel'
          from pm2_mcp.server import (
              mcp, main, list_services, get_service, get_logs, restart_service,
              stop_service, start_service, reload_service, save, flush_logs, get_status,
          )
          print('all tools importable from the installed wheel')
          "
          test -x /tmp/verify/bin/pm2-mcp
          /tmp/verify/bin/pm2-mcp --help
          # The bind guard runs before anything listens: a non-loopback host must refuse.
          if /tmp/verify/bin/pm2-mcp --host 0.0.0.0; then
            echo "::error::the installed entry point accepted a non-loopback bind"; exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
